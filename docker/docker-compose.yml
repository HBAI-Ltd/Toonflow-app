services:
  toonflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GIT: ${GIT:-github}
        TAG: ${TAG:-}
        BRANCH: ${BRANCH:-}
    image: toonflow:${TAG:-latest}
    container_name: toonflow
    restart: unless-stopped
    ports:
      - "8080:60000"
    environment:
      - NODE_ENV=prod
      # 可选: 持久化上传文件和数据库（如果需要持久化，可以取消注释）
      # - DB_PATH=/app/data/db.sqlite
    volumes:
    # 可选: 持久化日志
      - ../logs:/app/logs
      # 可选: 持久化上传文件和数据库（如果需要持久化，可以取消注释）
      # - ../uploads:/app/uploads
      # - ../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:60000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
