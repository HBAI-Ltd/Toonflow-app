name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: false
        type: string

env:
  NODE_VERSION: "24"

jobs:
  # ==================== Windows build ====================
  build-Windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            name: x64
          - arch: arm64
            name: ARM64

    runs-on: windows-latest
    name: Build Windows (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package Windows installer
        run: yarn dist:win --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.exe
          retention-days: 7

  # ==================== macOS build ====================
  build-macOS:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            name: Apple Silicon
          - arch: x64
            os: macos-latest
            name: Intel

    runs-on: ${{ matrix.os }}
    name: Build macOS (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Install platform-specific sharp
        if: matrix.arch == 'x64'
        run: |
          npm install --no-save --ignore-scripts --force @img/sharp-darwin-x64 @img/sharp-libvips-darwin-x64

      - name: Package macOS installer
        run: yarn dist:mac --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 7

  # ==================== Linux build ====================
  build-Linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            name: x64
          - arch: arm64
            name: ARM64

    runs-on: ubuntu-latest
    name: Build Linux (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Install platform-specific sharp
        if: matrix.arch == 'arm64'
        run: |
          npm install --no-save --ignore-scripts --force @img/sharp-linux-arm64 @img/sharp-libvips-linux-arm64

      - name: Package Linux installer
        run: yarn dist:linux --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage
          retention-days: 7

  # ==================== Release ====================
  release:
    needs: [build-Windows, build-macOS, build-Linux]
    runs-on: ubuntu-latest
    name: Publish to GitHub
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) -exec mv {} dist/ \;

      - name: List files to be released
        run: |
          echo "===== Files pending release ====="
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ToonFlow ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          body: |
            ## 📦 Download Guide

            | OS | Arch | File | Notes |
            |---------|------|------|------|
            | 🪟 Windows | x64 | `ToonFlow-*-win-x64-setup.exe` | **Recommended**, suitable for most Windows PCs |
            | 🪟 Windows | ARM64 | `ToonFlow-*-win-arm64-setup.exe` | For ARM-based Windows devices |
            | 🍎 macOS | Apple Silicon | `ToonFlow-*-mac-arm64.dmg` | For Macs with M1/M2/M3/M4 chips |
            | 🍎 macOS | Intel | `ToonFlow-*-mac-x64.dmg` | For Macs with Intel chips |
            | 🐧 Linux | x64 | `ToonFlow-*-linux-x86_64.AppImage` | For most Linux distributions |
            | 🐧 Linux | ARM64 | `ToonFlow-*-linux-arm64.AppImage` | For ARM-based Linux devices |

            > 💡 **Not sure which one to pick?** Windows users should generally choose **win-x64-setup.exe**; Mac users can check "About This Mac": M-series chips should choose **arm64.dmg**, Intel should choose **x64.dmg**.

            ## 🚀 Installation Instructions

            - **Windows**: Download the `.exe` file and double-click to run the setup wizard. If a DLL is reported missing, install the [VC++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe).
            - **macOS**: Download the `.dmg` file, open it, and drag the app into "Applications". If you get a security prompt on first launch, go to "System Settings → Privacy & Security" to allow it to run.
            - **Linux**: Download the `.AppImage`, run `chmod +x ToonFlow-*.AppImage`, then execute it.

            ---

          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release complete
        run: |
          echo "✅ Release complete!"
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
