name: Build Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  # ==================== Windows build ====================
  build-Windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            name: x64
          - arch: arm64
            name: ARM64

    runs-on: windows-latest
    name: Build Windows (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package Windows installer
        run: yarn dist:win --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.exe
          retention-days: 7

  # ==================== macOS build ====================
  build-macOS:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            name: Apple Silicon
          - arch: x64
            os: macos-latest
            name: Intel

    runs-on: ${{ matrix.os }}
    name: Build macOS (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Install platform-specific sharp
        if: matrix.arch == 'x64'
        run: |
          npm install --no-save --ignore-scripts --force @img/sharp-darwin-x64 @img/sharp-libvips-darwin-x64

      - name: Package macOS installer
        run: yarn dist:mac --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 7

  # ==================== Linux build ====================
  build-Linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            name: x64
          - arch: arm64
            name: ARM64

    runs-on: ubuntu-latest
    name: Build Linux (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Install platform-specific sharp
        if: matrix.arch == 'arm64'
        run: |
          npm install --no-save --ignore-scripts --force @img/sharp-linux-arm64 @img/sharp-libvips-linux-arm64

      - name: Package Linux installer
        run: yarn dist:linux --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage
          retention-days: 7

  # ==================== Build summary ====================
  summary:
    needs: [build-Windows, build-macOS, build-Linux]
    runs-on: ubuntu-latest
    name: Build Summary
    if: always()

    steps:
      - name: Print build results
        run: |
          echo "===== Build test complete ====="
          echo "Windows x64: ${{ needs.build-Windows.result }}"
          echo "Windows arm64: ${{ needs.build-Windows.result }}"
          echo "macOS Apple Silicon: ${{ needs.build-macOS.result }}"
          echo "macOS Intel: ${{ needs.build-macOS.result }}"
          echo "Linux x64: ${{ needs.build-Linux.result }}"
          echo "Linux arm64: ${{ needs.build-Linux.result }}"
          echo ""
          echo "Build artifacts are kept for 7 days and can be downloaded from the Actions page."
